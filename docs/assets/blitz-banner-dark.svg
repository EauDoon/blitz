<title id="title">Blitz — Minimum Viable Company kit</title>
<desc id="description">Blitz. Minimum Viable Company kit. Listen, collect, sprint. Reduce cycle time. Distinct input fragments gather into evidence and form a bounded output. This is a process illustration, not proof of demand, completed work or approval.</desc>
