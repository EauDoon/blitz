<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
<title id="title">Blitz, a founder operating kit</title>
<desc id="description">Make a promise, deliver it, get paid and run the next cycle. The four evidence gates are Frame, Test, Deliver and Operate. This illustration does not establish that a gate is passed.</desc>
<rect x="0" y="0" width="960" height="360" fill="#101C2E" stroke="none" stroke-width="1"/>
<rect x="0.5" y="0.5" width="959" height="359" fill="none" stroke="#405571" stroke-width="1"/>
<rect x="48" y="36" width="30" height="4" fill="#7CA6FF" stroke="none" stroke-width="1"/>
<text x="47" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="116" font-weight="700" text-anchor="start" fill="#F2F6FD">Blitz</text>
<text x="53" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#BBC9DD">A founder operating kit</text>
<text x="620" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#F2F6FD">Make a promise.</text>
<text x="620" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#F2F6FD">Deliver. Get paid.</text>
<text x="620" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#F2F6FD">Run the next cycle.</text>
