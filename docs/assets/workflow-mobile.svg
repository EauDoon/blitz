<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1840" viewBox="0 0 600 1840" role="img" aria-labelledby="title description">
<title id="title">Blitz — evidence gates and owner decisions</title>
<desc id="description">Frame the offer and next test; Test observed customer and payer behavior; Deliver the result and verify acceptance; Operate with reconciled cash and a feasible next cycle. At every gate an owner checks evidence and existing authority. Record Proceed for the next permitted step, Hold to pause the dependent action, or Walk to reject the scoped option. New evidence or revised scope returns to the affected gate. A gate does not grant permission.</desc>
<rect x="0" y="0" width="600" height="1840" fill="#F6F1E7" stroke="none" stroke-width="1"/>
<rect x="44" y="35" width="64" height="7" fill="#C13F17" stroke="none" stroke-width="1"/>
<text x="44" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#252923">Evidence sets</text>
<text x="44" y="161" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#252923">the next move.</text>
<text x="44" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#60635B">For the next commitment.</text>
<rect x="44" y="252" width="512" height="748" fill="#FFFCF6" stroke="#85877E" stroke-width="2"/>
<text x="68" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#C13F17">01</text>
<text x="127" y="311" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#252923">Frame</text>
<text x="68" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">Bound the offer</text>
<text x="68" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">and next test.</text>
<path d="M67 439 L532 439" fill="none" stroke="#DAD8CD" stroke-width="2"/>
<text x="68" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#C13F17">02</text>
<text x="127" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#252923">Test</text>
<text x="68" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">Observe customer</text>
<text x="68" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">and payer behavior.</text>
<path d="M67 626 L532 626" fill="none" stroke="#DAD8CD" stroke-width="2"/>
<text x="68" y="683" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#C13F17">03</text>
<text x="127" y="685" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#252923">Deliver</text>
<text x="68" y="737" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">Verify the result</text>
<text x="68" y="779" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">and acceptance.</text>
<path d="M67 813 L532 813" fill="none" stroke="#DAD8CD" stroke-width="2"/>
<text x="68" y="870" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#C13F17">04</text>
<text x="127" y="872" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#252923">Operate</text>
<text x="68" y="924" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">Reconcile cash.</text>
<text x="68" y="966" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#252923">Prepare the next cycle.</text>
<path d="M300 1000 L300 1031" fill="none" stroke="#85877E" stroke-width="2"/>
<path d="M294.918 1023.572 L300 1031 L305.082 1023.572" fill="none" stroke="#85877E" stroke-width="2"/>
<rect x="44" y="1032" width="512" height="175" fill="#252923" stroke="none" stroke-width="1"/>
<text x="68" y="1077" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#F6F1E7">AT EVERY GATE</text>
<text x="68" y="1131" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#F6F1E7">Owner checks evidence</text>
<text x="68" y="1180" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#F6F1E7">+ existing authority</text>
