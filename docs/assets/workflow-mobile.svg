<path d="M86.572 1293.082 L94 1288 L86.572 1282.918" fill="none" stroke="#85877E" stroke-width="2"/>
<text x="112" y="1295" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#252923">Proceed</text>
<text x="112" y="1341" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#60635B">Next permitted step</text>
<path d="M65 1410 L94 1410" fill="none" stroke="#85877E" stroke-width="2"/>
<path d="M86.572 1415.082 L94 1410 L86.572 1404.918" fill="none" stroke="#85877E" stroke-width="2"/>
<text x="112" y="1417" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#252923">Hold</text>
<text x="112" y="1463" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#60635B">Pause dependent action</text>
<path d="M65 1532 L94 1532" fill="none" stroke="#85877E" stroke-width="2"/>
<path d="M86.572 1537.082 L94 1532 L86.572 1526.918" fill="none" stroke="#85877E" stroke-width="2"/>
<text x="112" y="1539" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#252923">Walk</text>
<text x="112" y="1585" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#60635B">Reject scoped option</text>
<path d="M44 1630 L556 1630" fill="none" stroke="#DAD8CD" stroke-width="2"/>
<text x="68" y="1680" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#252923">New evidence / revised scope</text>
<text x="68" y="1724" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#252923">Revisit the affected gate.</text>
<path d="M47 1708 L21 1708 L21 626" fill="none" stroke="#C13F17" stroke-width="3" stroke-dasharray="7 7"/>
<path d="M21 626 L43 626" fill="none" stroke="#C13F17" stroke-width="3"/>
<path d="M35.572 631.082 L43 626 L35.572 620.918" fill="none" stroke="#C13F17" stroke-width="3"/>
<text x="68" y="1785" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#60635B">A gate does not grant</text>
<text x="68" y="1825" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#60635B">permission.</text>
