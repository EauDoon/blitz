<!--
Parametric inputs for this diagram. Schema and formulas: references/type-medallion.md
§1 (inputs contract) and §2 (geometry). Every coordinate in the SVG below is derivable
from §2 applied to these inputs.

title: "Five-tier e-commerce analytics storage"
eyebrow: "Medallion · Diagram Design"

tiers:                                # 5 tier columns, ordered left to right
  - { name: "Raw",        bucket: "raw-commerce",      style: "outer",
      fields: { tool: "NiFi ingest",              format: "JSON · Parquet",        writer: "Data Engineer",
                example: ["clickstream events", "order records"] } }
  - { name: "Anonymized", bucket: "anon-commerce",     style: "default",
      fields: { tool: "Trino SQL",                format: "Iceberg · partitioned",  writer: "Data Engineer",
                example: ["session pseudonyms", "masked customer IDs"] } }
  - { name: "Staging",    bucket: "staging-commerce",  style: "default",
      fields: { tool: "Trino · notebooks",         format: "Iceberg · cleaned",      writer: "Data Scientist",
                example: ["joined order facts", "validated event rows"] } }
  - { name: "Aggregated", bucket: "analytics-marts",   style: "focal",  focal: true,
      fields: { tool: "Trino INSERT",             format: "Iceberg · metrics",      writer: "Data Scientist",
                example: ["daily conversion rate", "revenue by channel"] } }
  - { name: "Archive",    bucket: "archive-commerce",  style: "cold",
      fields: { tool: "Object storage lifecycle", format: "Cold tier · immutable",  writer: "Data Engineer",
                example: ["retained clickstream", "closed order snapshots"] } }

example_label: "E-commerce example"

promotions:                           # adjacent-tier arcs; len = n_tiers - 1
  - { from: 0, to: 1, label: "MASK IDS",     style: "normal"    }
  - { from: 1, to: 2, label: "CLEAN + JOIN", style: "normal"    }
  - { from: 2, to: 3, label: "AGGREGATE",    style: "focal"     }   # auto-accent because target is focal
  - { from: 3, to: 4, label: "LIFECYCLE",    style: "lifecycle" }   # dashed

paths:
  - { tag: "SQL PATH",      title: "Trino INSERT INTO … SELECT",
      sub: "filter · join · aggregate, repeatable transforms" }
  - { tag: "NOTEBOOK PATH", title: "Python notebooks on object storage",
      sub: "explore · validate · model, interactive analysis" }

dark: false
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce analytics · Medallion</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #0f0f0f; --paper-2: #1a1a1a; --ink: #f5f7fa; --muted: #9aa0a8;
      --soft: #767c85; --rule: rgba(245,247,250,0.12); --accent: #c6ff3a;
      --accent-tint: rgba(198,255,58,0.08); --link: #5c78ff;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 1040px; }
    .tier-title { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
    .bucket, .field-value, .example-value { fill: var(--muted); font: 400 9px var(--mono); }
    .bucket { text-anchor: middle; }
    .field-value { color: var(--muted); }
    .focal-text { fill: var(--accent); }
    .field-label { fill: var(--ink); font: 600 11px var(--sans); }
    .example-label, .arc-label, .path-tag { font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .example-label { fill: var(--soft); font-size: 8px; }
    .arc-label { font-size: 10px; text-anchor: middle; }
    .path-title { fill: var(--ink); font: 600 11px var(--sans); }
    .path-sub { fill: var(--muted); font: 400 9px var(--mono); }
  </style>
</head>
<body>

    <p class="eyebrow">Medallion · Diagram Design</p>
    <h1>Five-tier e-commerce analytics storage</h1>
