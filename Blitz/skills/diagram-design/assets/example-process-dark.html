<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order fulfillment · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#0f0f0f;--ink:#f5f7fa;--muted:#9aa0a8;--soft:#767c85;--accent:#c6ff3a;--accent-tint:rgba(198,255,58,.08);--rule:rgba(245,247,250,.12);--label-rule:rgba(245,247,250,.20);--lane:rgba(245,247,250,.018);--node:#171717;--node-stroke:rgba(245,247,250,.25);--chip:rgba(245,247,250,.12);--dot:rgba(245,247,250,.10);--db:#82a0c0;--ls:#9caf8f;--fl:#b88670;--tb:#d3ad7a;--wb:#8d8298;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',Georgia, 'Times New Roman', serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1120px;width:100%}.eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}svg{width:100%;min-width:1000px;display:block}
    svg text{font-family:var(--sans)}.mono{font-family:var(--mono)}.lane{fill:var(--lane)}.rule{stroke:var(--rule)}.label-rule{stroke:var(--label-rule)}.actor{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.08em}.step-label{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.12em}.step-chip{fill:var(--chip)}.step-num{fill:var(--ink);font:600 7px var(--mono)}.connector{fill:none;stroke:var(--muted);stroke-width:1}.connector.focal{stroke:var(--accent);stroke-width:1.2}.node-mask{fill:var(--paper)}.node{fill:var(--node);stroke:var(--node-stroke)}.node.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.role{fill:rgba(245,247,250,.10)}.role.focal{fill:rgba(198,255,58,.25)}.role-text{fill:var(--ink);font:600 6px var(--mono)}.role-text.focal{fill:var(--accent)}.node-title{fill:var(--ink);font:600 9px var(--sans)}.node-sub{fill:var(--muted);font:6.5px var(--mono)}.node-tool{fill:var(--soft);font:6.5px var(--mono)}.data-text{fill:#f5f7fa;font:700 5px var(--mono)}.legend-key{fill:var(--muted);font:500 7px var(--mono);letter-spacing:.12em}.legend-text{fill:var(--muted);font:8px var(--sans)}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Diagram Design</p>
    <h1>Order fulfillment across four teams</h1>
    <svg viewBox="0 0 1064 436" xmlns="http://www.w3.org/2000/svg" aria-label="Order fulfillment process from customer order to support closure">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="var(--dot)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="var(--muted)"/></marker>
      </defs>
      <rect width="1064" height="436" fill="var(--paper)"/><rect width="1064" height="436" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="924" height="80"/><rect class="lane" x="140" y="196" width="924" height="80"/>
      <g class="rule" stroke-width=".8"><line x1="0" y1="36" x2="1064" y2="36"/><line x1="0" y1="116" x2="1064" y2="116"/><line x1="0" y1="196" x2="1064" y2="196"/><line x1="0" y1="276" x2="1064" y2="276"/><line x1="0" y1="356" x2="1064" y2="356"/></g>
      <line class="label-rule" x1="140" y1="36" x2="140" y2="356"/>
      <g class="actor" text-anchor="middle"><text x="72" y="80">CUSTOMER</text><text x="72" y="160">SUPPORT</text><text x="72" y="240">WAREHOUSE</text><text x="72" y="320">FINANCE</text></g>
      <g text-anchor="middle">
        <rect class="step-chip" x="192" y="8" width="16" height="16" rx="8"/><text class="step-num" x="200" y="19">1</text><text class="step-label" x="200" y="32">ORDER</text>
        <rect class="step-chip" x="304" y="8" width="16" height="16" rx="8"/><text class="step-num" x="312" y="19">2</text><text class="step-label" x="312" y="32">VERIFY</text>
        <rect x="416" y="8" width="16" height="16" rx="8" fill="rgba(198,255,58,.20)"/><text x="424" y="19" fill="var(--accent)" font-size="7" font-weight="600" class="mono">3</text><text x="424" y="32" fill="var(--accent)" font-size="8" font-weight="500" letter-spacing=".12em" class="mono">ALLOCATE</text>
        <rect class="step-chip" x="528" y="8" width="16" height="16" rx="8"/><text class="step-num" x="536" y="19">4</text><text class="step-label" x="536" y="32">PICK</text>
        <rect class="step-chip" x="640" y="8" width="16" height="16" rx="8"/><text class="step-num" x="648" y="19">5</text><text class="step-label" x="648" y="32">PACK</text>
        <rect class="step-chip" x="752" y="8" width="16" height="16" rx="8"/><text class="step-num" x="760" y="19">6</text><text class="step-label" x="760" y="32">PAY</text>
        <rect class="step-chip" x="864" y="8" width="16" height="16" rx="8"/><text class="step-num" x="872" y="19">7</text><text class="step-label" x="872" y="32">RECEIVE</text>
        <rect class="step-chip" x="976" y="8" width="16" height="16" rx="8"/><text class="step-num" x="984" y="19">8</text><text class="step-label" x="984" y="32">CLOSE</text>
      </g>
      <!-- Connectors: right exit, r=8 orthogonal bend, top/bottom entry. -->
      <path class="connector" d="M248 76 H304 Q312 76 312 84 V124" marker-end="url(#arrow)"/><path class="connector focal" d="M360 156 H416 Q424 156 424 164 V204" marker-end="url(#arrow-accent)"/><line class="connector focal" x1="472" y1="236" x2="484" y2="236" marker-end="url(#arrow-accent)"/><line class="connector" x1="584" y1="236" x2="596" y2="236" marker-end="url(#arrow)"/><path class="connector" d="M696 236 H752 Q760 236 760 244 V284" marker-end="url(#arrow)"/><path class="connector" d="M808 316 H864 Q872 316 872 308 V108" marker-end="url(#arrow)"/><path class="connector" d="M920 76 H976 Q984 76 984 84 V124" marker-end="url(#arrow)"/>
      <!-- Nodes -->
      <g text-anchor="middle">
        <g><rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/><rect class="node" x="148" y="44" width="100" height="64" rx="6"/><rect class="role" x="152" y="48" width="20" height="12" rx="2"/><text class="role-text" x="164" y="56">CUS</text><text class="node-title" x="200" y="70">Place order</text><text class="node-sub" x="200" y="84">cart → order</text><text class="node-tool" x="200" y="94">storefront</text><rect x="228" y="96" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="236" y="102">DB</text></g>
        <g><rect class="node-mask" x="260" y="124" width="100" height="64" rx="6"/><rect class="node" x="260" y="124" width="100" height="64" rx="6"/><rect class="role" x="264" y="128" width="20" height="12" rx="2"/><text class="role-text" x="276" y="136">SUP</text><text class="node-title" x="312" y="150">Verify order</text><text class="node-sub" x="312" y="164">order → cleared</text><text class="node-tool" x="312" y="174">service desk</text><rect x="264" y="176" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="272" y="182">DB</text><rect x="340" y="176" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="348" y="182">DB</text></g>
        <g><rect class="node-mask" x="372" y="204" width="100" height="64" rx="6"/><rect class="node focal" x="372" y="204" width="100" height="64" rx="6"/><rect class="role focal" x="376" y="208" width="20" height="12" rx="2"/><text class="role-text focal" x="388" y="216">WHS</text><text class="node-title" x="424" y="230">Allocate stock</text><text class="node-sub" x="424" y="244">order → pick list</text><text class="node-tool" x="424" y="254">inventory system</text><rect x="376" y="256" width="16" height="8" rx="2" fill="var(--db)"/><text class="data-text" x="384" y="262">DB</text><rect x="452" y="256" width="16" height="8" rx="2" fill="var(--ls)"/><text class="data-text" x="460" y="262">LS</text></g>
        <g><rect class="node-mask" x="484" y="204" width="100" height="64" rx="6"/><rect class="node" x="484" y="204" width="100" height="64" rx="6"/><rect class="role" x="488" y="208" width="20" height="12" rx="2"/><text class="role-text" x="500" y="216">WHS</text><text class="node-title" x="536" y="230">Pick items</text><text class="node-sub" x="536" y="244">list → picked</text><text class="node-tool" x="536" y="254">handheld scanner</text><rect x="488" y="256" width="16" height="8" rx="2" fill="var(--ls)"/><text class="data-text" x="496" y="262">LS</text><rect x="564" y="256" width="16" height="8" rx="2" fill="var(--ls)"/><text class="data-text" x="572" y="262">LS</text></g>
        <g><rect class="node-mask" x="596" y="204" width="100" height="64" rx="6"/><rect class="node" x="596" y="204" width="100" height="64" rx="6"/><rect class="role" x="600" y="208" width="20" height="12" rx="2"/><text class="role-text" x="612" y="216">WHS</text><text class="node-title" x="648" y="230">Pack order</text><text class="node-sub" x="648" y="244">picked → shipment</text><text class="node-tool" x="648" y="254">packing station</text><rect x="600" y="256" width="16" height="8" rx="2" fill="var(--ls)"/><text class="data-text" x="608" y="262">LS</text><rect x="676" y="256" width="16" height="8" rx="2" fill="var(--fl)"/><text class="data-text" x="684" y="262">FL</text></g>
        <g><rect class="node-mask" x="708" y="284" width="100" height="64" rx="6"/><rect class="node" x="708" y="284" width="100" height="64" rx="6"/><rect class="role" x="712" y="288" width="20" height="12" rx="2"/><text class="role-text" x="724" y="296">FIN</text><text class="node-title" x="760" y="310">Capture payment</text><text class="node-sub" x="760" y="324">shipment → receipt</text><text class="node-tool" x="760" y="334">payment gateway</text><rect x="712" y="336" width="16" height="8" rx="2" fill="var(--fl)"/><text class="data-text" x="720" y="342">FL</text><rect x="788" y="336" width="16" height="8" rx="2" fill="var(--tb)"/><text class="data-text" x="796" y="342">TB</text></g>
        <g><rect class="node-mask" x="820" y="44" width="100" height="64" rx="6"/><rect class="node" x="820" y="44" width="100" height="64" rx="6"/><rect class="role" x="824" y="48" width="20" height="12" rx="2"/><text class="role-text" x="836" y="56">CUS</text><text class="node-title" x="872" y="70">Receive shipment</text><text class="node-sub" x="872" y="84">receipt → confirmed</text><text class="node-tool" x="872" y="94">delivery portal</text><rect x="824" y="96" width="16" height="8" rx="2" fill="var(--tb)"/><text class="data-text" x="832" y="102">TB</text><rect x="900" y="96" width="16" height="8" rx="2" fill="var(--wb)"/><text class="data-text" x="908" y="102">WB</text></g>
        <g><rect class="node-mask" x="932" y="124" width="100" height="64" rx="6"/><rect class="node" x="932" y="124" width="100" height="64" rx="6"/><rect class="role" x="936" y="128" width="20" height="12" rx="2"/><text class="role-text" x="948" y="136">SUP</text><text class="node-title" x="984" y="150">Close order</text><text class="node-sub" x="984" y="164">confirmed → closed</text><text class="node-tool" x="984" y="174">service desk</text><rect x="936" y="176" width="16" height="8" rx="2" fill="var(--wb)"/><text class="data-text" x="944" y="182">WB</text></g>
      </g>
      <!-- Three-row type key -->
      <g><text class="legend-key" x="144" y="372">STEPS</text><g text-anchor="middle"><rect class="step-chip" x="208" y="364" width="16" height="16" rx="8"/><text class="step-num" x="216" y="375">1</text><text class="legend-text" x="248" y="375">ORDER</text><rect class="step-chip" x="300" y="364" width="16" height="16" rx="8"/><text class="step-num" x="308" y="375">2</text><text class="legend-text" x="340" y="375">VERIFY</text><rect x="392" y="364" width="16" height="16" rx="8" fill="rgba(198,255,58,.20)"/><text x="400" y="375" fill="var(--accent)" font-size="7" class="mono">3</text><text x="432" y="375" fill="var(--accent)" font-size="8">ALLOCATE</text><rect class="step-chip" x="496" y="364" width="16" height="16" rx="8"/><text class="step-num" x="504" y="375">4</text><text class="legend-text" x="532" y="375">PICK</text><rect class="step-chip" x="576" y="364" width="16" height="16" rx="8"/><text class="step-num" x="584" y="375">5</text><text class="legend-text" x="612" y="375">PACK</text><rect class="step-chip" x="656" y="364" width="16" height="16" rx="8"/><text class="step-num" x="664" y="375">6</text><text class="legend-text" x="692" y="375">PAY</text><rect class="step-chip" x="736" y="364" width="16" height="16" rx="8"/><text class="step-num" x="744" y="375">7</text><text class="legend-text" x="780" y="375">RECEIVE</text><rect class="step-chip" x="832" y="364" width="16" height="16" rx="8"/><text class="step-num" x="840" y="375">8</text><text class="legend-text" x="872" y="375">CLOSE</text></g>
      <text class="legend-key" x="144" y="393">DATA TYPE</text><rect x="220" y="388" width="16" height="8" rx="2" fill="var(--db)"/><text class="legend-text" x="244" y="393">DB · records</text><rect x="328" y="388" width="16" height="8" rx="2" fill="var(--ls)"/><text class="legend-text" x="352" y="393">LS · task</text><rect x="428" y="388" width="16" height="8" rx="2" fill="var(--fl)"/><text class="legend-text" x="452" y="393">FL · document</text><rect x="552" y="388" width="16" height="8" rx="2" fill="var(--tb)"/><text class="legend-text" x="576" y="393">TB · transaction</text><rect x="688" y="388" width="16" height="8" rx="2" fill="var(--wb)"/><text class="legend-text" x="712" y="393">WB · web status</text><text class="legend-key" x="856" y="393">LEFT IN · RIGHT OUT</text>
      <text class="legend-key" x="144" y="414">FLOW</text><line x1="200" y1="412" x2="228" y2="412" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text class="legend-text" x="240" y="414">Critical handoff</text><line x1="360" y1="412" x2="388" y2="412" stroke="var(--muted)" marker-end="url(#arrow)"/><text class="legend-text" x="400" y="414">Sequential handoff</text></g>
    </svg>
  </div>
</body>
</html>
