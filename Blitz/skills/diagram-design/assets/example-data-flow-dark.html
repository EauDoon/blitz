<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics pipeline · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #0f0f0f; --paper-2: #1a1a1a; --ink: #f5f7fa; --muted: #9aa0a8;
      --soft: #767c85; --rule: rgba(245,247,250,0.12); --accent: #c6ff3a;
      --accent-tint: rgba(198,255,58,0.08); --link: #5c78ff;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 728px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #171717; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>Role-scoped analytics pipeline</h1>

    <svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">Role-scoped analytics data flow</title>
      <desc id="flow-desc">A Data Engineer ingests and stores commerce data, a Data Scientist transforms and analyzes it, and an Analyst publishes a dashboard.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(245,247,250,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#9aa0a8"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#c6ff3a"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#5c78ff"/></marker>
      </defs>
      <rect width="728" height="356" fill="#0f0f0f"/>
      <rect width="728" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(245,247,250,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(245,247,250,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(245,247,250,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(245,247,250,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(245,247,250,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(245,247,250,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(245,247,250,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="4" width="32" height="16" rx="8" fill="rgba(245,247,250,0.12)"/><text x="196" y="12" class="step-number">01</text><text x="196" y="29" class="step-label">INGEST</text>
        <rect x="292" y="4" width="32" height="16" rx="8" fill="rgba(245,247,250,0.12)"/><text x="308" y="12" class="step-number">02</text><text x="308" y="29" class="step-label">STORE</text>
        <rect x="404" y="4" width="32" height="16" rx="8" fill="rgba(198,255,58,0.20)"/><text x="420" y="12" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">TRANSFORM</text>
        <rect x="516" y="4" width="32" height="16" rx="8" fill="rgba(245,247,250,0.12)"/><text x="532" y="12" class="step-number">04</text><text x="532" y="29" class="step-label">ANALYZE</text>
        <rect x="628" y="4" width="32" height="16" rx="8" fill="rgba(245,247,250,0.12)"/><text x="644" y="12" class="step-number">05</text><text x="644" y="29" class="step-label">PUBLISH</text>
      </g>

      <g aria-label="Role lanes">
        <text x="72" y="72" class="lane-label">DATA</text><text x="72" y="84" class="lane-label">ENGINEER</text>
        <text x="72" y="152" class="lane-label">DATA</text><text x="72" y="164" class="lane-label">SCIENTIST</text>
        <text x="72" y="232" class="lane-label">ANALYTICS</text><text x="72" y="244" class="lane-label">ANALYST</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M248 76 H256" fill="none" stroke="#9aa0a8" marker-end="url(#arr-muted)"/>
      <path d="M360 76 H412 Q420 76 420 84 V124" fill="none" stroke="#c6ff3a" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M472 156 H480" fill="none" stroke="#9aa0a8" marker-end="url(#arr-muted)"/>
      <path d="M584 156 H636 Q644 156 644 164 V204" fill="none" stroke="#5c78ff" marker-end="url(#arr-link)"/>
      <rect x="368" y="56" width="48" height="12" rx="2" fill="#0f0f0f"/>
      <text x="392" y="65" fill="#c6ff3a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAW TABLE</text>

      <!-- Data Engineer: Capture Events -->
      <rect x="144" y="44" width="104" height="64" rx="6" fill="#0f0f0f" stroke="rgba(245,247,250,0.25)"/>
      <rect x="148" y="48" width="16" height="8" rx="4" fill="rgba(245,247,250,0.12)"/><text x="156" y="54" class="role-text">ENG</text>
      <text x="196" y="67" class="node-title">Capture Events</text><text x="196" y="79" class="node-sub">shop events → batch</text><text x="196" y="91" class="node-tool">NiFi ingest</text>
      <rect x="148" y="96" width="16" height="8" rx="4" fill="#9caf8f"/><text x="156" y="102" class="chip-text">LS</text>
      <rect x="228" y="96" width="16" height="8" rx="4" fill="#82a0c0"/><text x="236" y="102" class="chip-text">DB</text>

      <!-- Data Engineer: Land Records -->
      <rect x="256" y="44" width="104" height="64" rx="6" fill="#0f0f0f" stroke="rgba(245,247,250,0.25)"/>
      <rect x="260" y="48" width="16" height="8" rx="4" fill="rgba(245,247,250,0.12)"/><text x="268" y="54" class="role-text">ENG</text>
      <text x="308" y="67" class="node-title">Land Records</text><text x="308" y="79" class="node-sub">events · orders</text><text x="308" y="91" class="node-tool">Object storage</text>
      <rect x="260" y="96" width="16" height="8" rx="4" fill="#82a0c0"/><text x="268" y="102" class="chip-text">DB</text>
      <rect x="340" y="96" width="16" height="8" rx="4" fill="#82a0c0"/><text x="348" y="102" class="chip-text">DB</text>

      <!-- Data Scientist: Clean and Model (focal) -->
      <rect x="368" y="124" width="104" height="64" rx="6" fill="rgba(198,255,58,0.07)" stroke="#c6ff3a" stroke-width="1.2"/>
      <rect x="372" y="128" width="16" height="8" rx="4" fill="rgba(198,255,58,0.20)"/><text x="380" y="134" class="role-text focal-text">SCI</text>
      <text x="420" y="147" class="node-title">Clean &amp; Model</text><text x="420" y="159" class="node-sub">raw → trusted table</text><text x="420" y="171" class="node-tool">Trino · notebooks</text>
      <rect x="372" y="176" width="16" height="8" rx="4" fill="#82a0c0"/><text x="380" y="182" class="chip-text">DB</text>
      <rect x="452" y="176" width="16" height="8" rx="4" fill="#d3ad7a"/><text x="460" y="182" class="chip-text">TB</text>

      <!-- Data Scientist: Curate Metrics -->
      <rect x="480" y="124" width="104" height="64" rx="6" fill="#0f0f0f" stroke="rgba(245,247,250,0.25)"/>
      <rect x="484" y="128" width="16" height="8" rx="4" fill="rgba(245,247,250,0.12)"/><text x="492" y="134" class="role-text">SCI</text>
      <text x="532" y="147" class="node-title">Curate Metrics</text><text x="532" y="159" class="node-sub">conversion · revenue</text><text x="532" y="171" class="node-tool">Trino SQL</text>
      <rect x="484" y="176" width="16" height="8" rx="4" fill="#d3ad7a"/><text x="492" y="182" class="chip-text">TB</text>
      <rect x="564" y="176" width="16" height="8" rx="4" fill="#d3ad7a"/><text x="572" y="182" class="chip-text">TB</text>

      <!-- Analyst: Publish Dashboard -->
      <rect x="592" y="204" width="104" height="64" rx="6" fill="#0f0f0f" stroke="rgba(245,247,250,0.25)"/>
      <rect x="596" y="208" width="16" height="8" rx="4" fill="rgba(245,247,250,0.12)"/><text x="604" y="214" class="role-text">ANL</text>
      <text x="644" y="227" class="node-title">Publish Dashboard</text><text x="644" y="239" class="node-sub">metrics → decisions</text><text x="644" y="251" class="node-tool">BI workspace</text>
      <rect x="596" y="256" width="16" height="8" rx="4" fill="#d3ad7a"/><text x="604" y="262" class="chip-text">TB</text>
      <rect x="676" y="256" width="16" height="8" rx="4" fill="#b88670"/><text x="684" y="262" class="chip-text">FL</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(245,247,250,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Ingest</text>
      <rect x="272" y="284" width="24" height="12" rx="6" fill="rgba(245,247,250,0.12)"/><text x="284" y="292" class="step-number">02</text><text x="304" y="293" class="legend-text">Store</text>
      <rect x="360" y="284" width="24" height="12" rx="6" fill="rgba(198,255,58,0.20)"/><text x="372" y="292" class="step-number focal-text">03</text><text x="392" y="293" class="legend-text">Transform</text>
      <rect x="468" y="284" width="24" height="12" rx="6" fill="rgba(245,247,250,0.12)"/><text x="480" y="292" class="step-number">04</text><text x="500" y="293" class="legend-text">Analyze</text>
      <rect x="568" y="284" width="24" height="12" rx="6" fill="rgba(245,247,250,0.12)"/><text x="580" y="292" class="step-number">05</text><text x="600" y="293" class="legend-text">Publish</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="308" width="16" height="8" rx="4" fill="#9caf8f"/><text x="188" y="314" class="chip-text">LS</text><text x="204" y="314" class="legend-text">Stream</text>
      <rect x="252" y="308" width="16" height="8" rx="4" fill="#82a0c0"/><text x="260" y="314" class="chip-text">DB</text><text x="276" y="314" class="legend-text">Dataset</text>
      <rect x="332" y="308" width="16" height="8" rx="4" fill="#d3ad7a"/><text x="340" y="314" class="chip-text">TB</text><text x="356" y="314" class="legend-text">Table</text>
      <rect x="404" y="308" width="16" height="8" rx="4" fill="#b88670"/><text x="412" y="314" class="chip-text">FL</text><text x="428" y="314" class="legend-text">Dashboard</text>
      <text x="500" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="332" x2="204" y2="332" stroke="#9aa0a8" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Standard handoff</text>
      <line x1="324" y1="332" x2="348" y2="332" stroke="#c6ff3a" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="356" y="336" class="legend-text">Focal handoff</text>
      <line x1="460" y1="332" x2="484" y2="332" stroke="#5c78ff" marker-end="url(#arr-link)"/><text x="492" y="336" class="legend-text">Published output</text>
    </svg>
  </main>
</body>
</html>
