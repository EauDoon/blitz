<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good design · Desirable × Feasible × Viable</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0f0f0f;
      --color-ink:     #f5f7fa;
      --color-muted:   #9aa0a8;
      --color-accent:  #c6ff3a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Venn · Diagram Design</p>
    <h1>Good design · Desirable × Feasible × Viable</h1>

    <svg viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Chained clips isolate the all-three intersection: clip to Desirable, then to Feasible, then fill via the third circle. -->
          <clipPath id="clip-desirable">
            <circle cx="260" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-feasible">
            <circle cx="188" cy="320" r="140"/>
          </clipPath>
        </defs>

        <rect width="100%" height="100%" fill="#0f0f0f"/>

        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable: top, ink -->
        <circle cx="260" cy="180" r="140" fill="rgba(245,247,250,0.04)" stroke="#f5f7fa" stroke-width="1"/>
        <!-- Feasible: bottom-left, muted -->
        <circle cx="188" cy="320" r="140" fill="rgba(154,160,168,0.05)" stroke="#9aa0a8" stroke-width="1"/>
        <!-- Viable: bottom-right, soft -->
        <circle cx="332" cy="320" r="140" fill="rgba(118,124,133,0.05)" stroke="#767c85" stroke-width="1"/>

        <!-- Focal: solid-ink triple intersection (dark fill for white text to read against) -->
        <g clip-path="url(#clip-desirable)">
          <g clip-path="url(#clip-feasible)">
            <circle cx="332" cy="320" r="140" fill="#f5f7fa"/>
          </g>
        </g>

        <!-- Set labels: positioned INSIDE each circle's non-overlapping lobe, so the diagram reads like a classic Venn -->
        <!-- Desirable: top lobe (centered inside top of Desirable circle) -->
        <text x="260" y="96" fill="#f5f7fa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Desirable</text>
        <text x="260" y="112" fill="#9aa0a8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PEOPLE WANT IT</text>

        <!-- Feasible: bottom-left lobe -->
        <text x="100" y="386" fill="#f5f7fa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Feasible</text>
        <text x="100" y="402" fill="#9aa0a8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WE CAN BUILD IT</text>

        <!-- Viable: bottom-right lobe -->
        <text x="420" y="386" fill="#f5f7fa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Viable</text>
        <text x="420" y="402" fill="#9aa0a8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BUSINESS SUSTAINS</text>

        <!-- Focal label: white text on the dark intersection -->
        <text x="260" y="268" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shippable</text>
        <text x="260" y="284" fill="rgba(15,15,15,0.75)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">THE SWEET SPOT</text>
      </svg>
  </div>
</body>
</html>
